<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password · CliniPauseMD</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-card {
    width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 36px 32px; box-shadow: var(--shadow-card);
  }
  .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .login-logo .logo-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--green); }
  .login-logo span { font-family: var(--font-head); font-weight: 700; font-size: 22px; color: var(--green); }
  .login-sub { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
  .login-field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .login-field label { font-size: 13px; font-weight: 600; color: var(--text-dark); }
  .login-field input {
    border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px;
    font-size: 14px; font-family: var(--font-body); width: 100%;
  }
  .login-field input:focus { outline: none; border-color: var(--green); }
  .login-error {
    display: none; background: var(--red-bg); color: #a12626; font-size: 13px;
    padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px;
  }
  .login-error.show { display: block; }
  .login-info {
    display: none; background: var(--blue-bg); color: var(--blue); font-size: 13px;
    padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px;
  }
  .login-info.show { display: block; }
  .login-confirm {
    display: none; background: var(--green-bg); color: var(--green); font-size: 13px;
    padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px;
  }
  .login-confirm.show { display: block; }
  .login-submit {
    width: 100%; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .login-submit:disabled { opacity: 0.7; cursor: not-allowed; }
  .login-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 20px; }
  .back-link { display: inline-block; margin-top: 4px; font-size: 13px; color: var(--blue); text-decoration: underline; }
  #reset-form { display: none; }
  #reset-form.show { display: block; }
  #waiting-note { font-size: 13px; color: var(--text-muted); }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo"><span class="logo-dot"></span><span>CliniPauseMD</span></div>
  <p class="login-sub">Set a new password for your admin account.</p>

  <p class="login-error" id="reset-error"></p>
  <p class="login-info show" id="waiting-note">Checking your reset link&hellip;</p>
  <p class="login-confirm" id="reset-confirm">Your password has been updated. You can now sign in with your new password.</p>

  <form id="reset-form">
    <div class="login-field">
      <label>New password</label>
      <input type="password" name="password" autocomplete="new-password" required minlength="8">
    </div>
    <div class="login-field">
      <label>Confirm new password</label>
      <input type="password" name="confirm" autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" class="login-submit" id="reset-submit">Set New Password</button>
  </form>

  <div id="done-actions" style="display:none;">
    <a class="back-link" href="login.html">Back to sign in</a>
  </div>
  <div id="invalid-actions" style="display:none;">
    <a class="back-link" href="login.html">Back to sign in</a>
  </div>

  <p class="login-note">CliniPauseMD internal admin access only.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script>
(function () {
  var errorEl = document.getElementById('reset-error');
  var waitingNote = document.getElementById('waiting-note');
  var confirmEl = document.getElementById('reset-confirm');
  var form = document.getElementById('reset-form');
  var submitBtn = document.getElementById('reset-submit');
  var doneActions = document.getElementById('done-actions');
  var invalidActions = document.getElementById('invalid-actions');
  var recoveryReady = false;

  function showInvalid() {
    if (recoveryReady) return; // recovery already established — ignore stale timeout
    waitingNote.classList.remove('show');
    errorEl.textContent = 'This page is only reachable via the link in a password reset email. Request a new one from the login page.';
    errorEl.classList.add('show');
    invalidActions.style.display = 'block';
  }

  if (typeof sb === 'undefined') {
    waitingNote.classList.remove('show');
    errorEl.textContent = 'Could not load the sign-in service. Check your connection and reload the page.';
    errorEl.classList.add('show');
    return;
  }

  var invalidTimer = setTimeout(showInvalid, 6000);

  sb.auth.onAuthStateChange(function (event) {
    if (event === 'PASSWORD_RECOVERY') {
      recoveryReady = true;
      clearTimeout(invalidTimer);
      waitingNote.classList.remove('show');
      errorEl.classList.remove('show');
      form.classList.add('show');
    }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!recoveryReady) return; // guard: never submit without a verified recovery session

    var fd = new FormData(e.target);
    var password = fd.get('password') || '';
    var confirm = fd.get('confirm') || '';

    errorEl.classList.remove('show');

    if (password.length < 8) {
      errorEl.textContent = 'Password must be at least 8 characters.';
      errorEl.classList.add('show');
      return;
    }
    if (password !== confirm) {
      errorEl.textContent = 'Passwords do not match.';
      errorEl.classList.add('show');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving…';

    sb.auth.updateUser({ password: password }).then(function (result) {
      if (result.error) throw result.error;
      form.classList.remove('show');
      confirmEl.classList.add('show');
      doneActions.style.display = 'block';
    }).catch(function (err) {
      errorEl.textContent = (err && err.message) || 'Could not update your password. Your reset link may have expired — request a new one.';
      errorEl.classList.add('show');
    }).finally(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set New Password';
    });
  });
})();
</script>
</body>
</html>
