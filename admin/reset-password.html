<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password · CliniPauseMD</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body { background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-card {
    width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 36px 32px; box-shadow: var(--shadow-card);
  }
  .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .login-logo .logo-dot { width: 16px; height: 16px; border-radius: 50%; background: var(--green); }
  .login-logo span { font-family: var(--font-head); font-weight: 700; font-size: 22px; color: var(--green); }
  .login-sub { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
  .login-field { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; }
  .login-field label { font-size: 13px; font-weight: 600; color: var(--text-dark); }
  .login-field input {
    border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 11px 14px;
    font-size: 14px; font-family: var(--font-body); width: 100%;
  }
  .login-field input:focus { outline: none; border-color: var(--green); }
  .login-error {
    display: none; background: var(--red-bg); color: #a12626; font-size: 13px;
    padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px;
  }
  .login-error.show { display: block; }
  .login-confirm {
    display: none; background: var(--green-bg); color: var(--green); font-size: 13px;
    padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px;
  }
  .login-confirm.show { display: block; }
  .login-submit {
    width: 100%; background: var(--green); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .login-submit:disabled { opacity: 0.7; cursor: not-allowed; }
  .login-note { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 20px; }
  .back-link { display: inline-block; margin-top: 4px; font-size: 13px; color: var(--blue); text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; }
  .resend-link { display: inline-block; margin-top: 12px; font-size: 13px; color: var(--blue); text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0; }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo"><span class="logo-dot"></span><span>CliniPauseMD</span></div>

  <p class="login-error" id="reset-error"></p>

  <!-- Step 1: email -->
  <div class="step active" id="step-email">
    <p class="login-sub">Enter your admin email and we'll send you a 6-digit reset code.</p>
    <form id="email-form">
      <div class="login-field">
        <label>Email</label>
        <input type="email" name="email" autocomplete="username" required>
      </div>
      <button type="submit" class="login-submit" id="email-submit">Send Reset Code</button>
    </form>
    <a class="back-link" href="login.html">Back to sign in</a>
  </div>

  <!-- Step 2: code -->
  <div class="step" id="step-code">
    <p class="login-sub">Enter the 6-digit code we sent to <strong id="code-email-display"></strong>.</p>
    <form id="code-form">
      <div class="login-field">
        <label>Reset code</label>
        <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" required>
      </div>
      <button type="submit" class="login-submit" id="code-submit">Verify Code</button>
    </form>
    <button type="button" class="resend-link" id="resend-link">Didn't get a code? Send again</button>
    <br>
    <button type="button" class="back-link" id="back-to-email">Use a different email</button>
  </div>

  <!-- Step 3: new password -->
  <div class="step" id="step-password">
    <p class="login-sub">Code verified. Choose your new password.</p>
    <form id="password-form">
      <div class="login-field">
        <label>New password</label>
        <input type="password" name="password" autocomplete="new-password" required minlength="12">
      </div>
      <div class="login-field">
        <label>Confirm new password</label>
        <input type="password" name="confirm" autocomplete="new-password" required minlength="12">
      </div>
      <button type="submit" class="login-submit" id="password-submit">Set New Password</button>
    </form>
  </div>

  <!-- Step 4: done -->
  <div class="step" id="step-done">
    <p class="login-confirm show">Your password has been updated. Redirecting you to sign in…</p>
  </div>

  <p class="login-note">CliniPauseMD internal admin access only.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/nopause-backend.js"></script>
<script>
(function () {
  var errorEl = document.getElementById('reset-error');
  var steps = {
    email: document.getElementById('step-email'),
    code: document.getElementById('step-code'),
    password: document.getElementById('step-password'),
    done: document.getElementById('step-done')
  };
  var emailForm = document.getElementById('email-form');
  var emailSubmit = document.getElementById('email-submit');
  var codeForm = document.getElementById('code-form');
  var codeSubmit = document.getElementById('code-submit');
  var passwordForm = document.getElementById('password-form');
  var passwordSubmit = document.getElementById('password-submit');
  var resendLink = document.getElementById('resend-link');
  var backToEmail = document.getElementById('back-to-email');
  var codeEmailDisplay = document.getElementById('code-email-display');

  var currentEmail = '';

  function showStep(name) {
    Object.keys(steps).forEach(function (key) {
      steps[key].classList.toggle('active', key === name);
    });
    errorEl.classList.remove('show');
  }

  function showError(message) {
    errorEl.textContent = message;
    errorEl.classList.add('show');
  }

  if (!window.nopauseSb) {
    showError('Could not load the sign-in service. Check your connection and reload the page.');
    emailSubmit.disabled = true;
    return;
  }

  // Pre-fill email if it was carried over (e.g. from a bookmarked link).
  var params = new URLSearchParams(location.search);
  var prefillEmail = params.get('email');
  if (prefillEmail) emailForm.email.value = prefillEmail;

  function sendCode(email) {
    return window.nopauseSb.auth.resetPasswordForEmail(email);
  }

  emailForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    currentEmail = (fd.get('email') || '').trim();
    if (!currentEmail) return;

    emailSubmit.disabled = true;
    emailSubmit.textContent = 'Sending…';

    sendCode(currentEmail).catch(function () {
      // Intentionally ignored — we never reveal whether the email exists,
      // to avoid user enumeration. The user always proceeds to the code step.
    }).finally(function () {
      emailSubmit.disabled = false;
      emailSubmit.textContent = 'Send Reset Code';
      codeEmailDisplay.textContent = currentEmail;
      showStep('code');
    });
  });

  backToEmail.addEventListener('click', function () {
    showStep('email');
  });

  resendLink.addEventListener('click', function () {
    resendLink.disabled = true;
    resendLink.textContent = 'Sending…';
    sendCode(currentEmail).catch(function () {}).finally(function () {
      resendLink.disabled = false;
      resendLink.textContent = 'Code sent. Send again';
    });
  });

  codeForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var code = (fd.get('code') || '').trim();

    codeSubmit.disabled = true;
    codeSubmit.textContent = 'Verifying…';

    window.nopauseSb.auth.verifyOtp({ email: currentEmail, token: code, type: 'recovery' }).then(function (result) {
      if (result.error) throw result.error;
      showStep('password');
    }).catch(function (err) {
      showError((err && err.message) || 'That code is incorrect or has expired. Request a new one.');
    }).finally(function () {
      codeSubmit.disabled = false;
      codeSubmit.textContent = 'Verify Code';
    });
  });

  passwordForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var fd = new FormData(e.target);
    var password = fd.get('password') || '';
    var confirm = fd.get('confirm') || '';

    if (password.length < 12) {
      showError('Password must be at least 12 characters.');
      return;
    }
    if (password !== confirm) {
      showError('Passwords do not match.');
      return;
    }

    passwordSubmit.disabled = true;
    passwordSubmit.textContent = 'Saving…';

    window.nopauseSb.auth.updateUser({ password: password }).then(function (result) {
      if (result.error) throw result.error;
      return window.nopauseSb.auth.signOut();
    }).then(function () {
      showStep('done');
      setTimeout(function () {
        location.href = 'login.html';
      }, 2000);
    }).catch(function (err) {
      showError((err && err.message) || 'Could not update your password. Please try again.');
    }).finally(function () {
      passwordSubmit.disabled = false;
      passwordSubmit.textContent = 'Set New Password';
    });
  });
})();
</script>
</body>
</html>
